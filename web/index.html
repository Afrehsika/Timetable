<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>School Timetable Studio</title>
    <!-- Favicon: Minimalist Calendar SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='18' rx='2' ry='2'%3E%3C/rect%3E%3Cline x1='16' y1='2' x2='16' y2='6'%3E%3C/line%3E%3Cline x1='8' y1='2' x2='8' y2='6'%3E%3C/line%3E%3Cline x1='3' y1='10' x2='21' y2='10'%3E%3C/line%3E%3Cpath d='M8 14h.01'%3E%3C/path%3E%3Cpath d='M12 14h.01'%3E%3C/path%3E%3Cpath d='M16 14h.01'%3E%3C/path%3E%3Cpath d='M8 18h.01'%3E%3C/path%3E%3Cpath d='M12 18h.01'%3E%3C/path%3E%3Cpath d='M16 18h.01'%3E%3C/path%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css?v=2">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
    <!-- Premium Landing Page -->
    <div id="landing-page" class="landing-page">
        <!-- Landing Navbar -->
        <nav class="landing-nav">
            <div class="landing-logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                <span>Timetable Studio</span>
            </div>
            <div class="landing-links">
                <a href="#">Features</a>
                <a href="#">Solutions</a>
                <a href="#">Pricing</a>
                <a href="#">About</a>
            </div>
            <div class="landing-auth">
                <a href="#" class="nav-btn nav-btn-ghost">Log in</a>
                <a href="#" class="nav-btn nav-btn-primary">Sign up</a>
            </div>
        </nav>

        <!-- Animated Background Orbs -->
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="landing-content">
            <div class="hero-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                    <path d="M8 14h.01"></path>
                    <path d="M12 14h.01"></path>
                    <path d="M16 14h.01"></path>
                    <path d="M8 18h.01"></path>
                    <path d="M12 18h.01"></path>
                    <path d="M16 18h.01"></path>
                </svg>
            </div>
            <h1 class="landing-title">Timetable Studio</h1>
            <p class="landing-subtitle">AI-Powered Scheduling for Modern Education. Intelligently generate conflict-free schedules in seconds.</p>
            <button id="btn-get-started" class="btn-get-started">
                Get Started
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>
    </div>
    <header>
        <h1>Timetable Studio</h1>
        <div class="controls">
            <button id="nav-data" class="active">1. Input Data</button>
            <button id="nav-grid">2. View Timetable</button>
        </div>
    </header>
    
    <main id="app-content">
        <!-- 1. DATA ENTRY VIEW (aSc Style Management Table) -->
        <div id="data-view" class="view-section">
            <div class="management-layout">
                <!-- Sidebar -->
                <div class="sidebar">
                    <div class="sidebar-item active" data-target="subject">
                        Subjects
                    </div>
                    <div class="sidebar-item" data-target="teacher">
                        Teachers
                    </div>
                    <div class="sidebar-item" data-target="class">
                        Classes
                    </div>
                    <div class="sidebar-item" data-target="room">
                        Rooms
                    </div>
                    <div class="sidebar-item" data-target="lesson">
                        Lessons
                    </div>
                    <div class="sidebar-item" data-target="bell">
                        Bells & Times
                    </div>
                </div>

                <!-- Main Table Area -->
                <div class="table-area">
                    <table class="data-table" id="data-table">
                        <thead>
                            <tr id="table-head">
                                <!-- Dynamic headers injected by JS -->
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Dynamic rows injected by JS -->
                        </tbody>
                    </table>
                </div>

                <!-- Right Action Panel -->
                <div class="action-panel">
                    <button id="btn-new" class="action-btn">
                        <span class="icon-new">+</span> New
                    </button>
                    <button id="btn-edit" class="action-btn disabled">Edit</button>
                    <button id="btn-delete" class="action-btn disabled">Delete</button>
                    
                    <hr style="width: 100%; border: 0; border-top: 1px solid #cbd5e1; margin: 15px 0;">
                    
                    <button id="btn-generate-api" class="primary-btn">Generate Timetable</button>
                    <div id="generate-status" style="margin-top: 10px; color: var(--color-eng); font-weight: bold; font-size: 12px; text-align: center;"></div>
                    
                    <hr style="width: 100%; border: 0; border-top: 1px solid #cbd5e1; margin: 15px 0;">
                    
                    <button id="btn-save-db" class="action-btn" style="background: #e2e8f0; color: #1e293b; border-color: #cbd5e1;">Save to DB</button>
                    <button id="btn-load-db" class="action-btn" style="background: #e2e8f0; color: #1e293b; border-color: #cbd5e1;">Load from DB</button>
                    <button id="btn-upload-excel" class="action-btn" style="background: #10b981; color: white; border-color: #059669;">Import Excel</button>
                    <button id="btn-download-template" class="action-btn" style="background: #3b82f6; color: white; border-color: #2563eb;">Download Template</button>
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls" style="display: none;">
                    
                    <button id="btn-load-sample" class="action-btn" style="margin-top: auto;">Load Sample Data</button>
                </div>
            </div>
        </div>

        <!-- 2. TIMETABLE VIEW -->
        <div id="timetable-view" class="view-section" style="display: none;">
            <div style="margin-bottom: 20px;">
                <button id="btn-master" class="active" style="background: transparent; color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px;">Master Grid</button>
                <button id="btn-class" style="background: transparent; color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px; margin-left: 10px;">Print Preview</button>
            </div>
            <div id="grid-container-area"></div>
        </div>
    </main>

    <!-- Modal for adding new item -->
    <div id="new-item-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top: 0;">New Item</h3>
            <div id="modal-form"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button id="modal-cancel" style="padding: 8px 15px; margin-right: 10px; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; color: black;">Cancel</button>
                <button id="modal-save" style="padding: 8px 15px; background: var(--color-phys); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal for editing scheduled class -->
    <div id="change-room-modal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top: 0;">Edit Class</h3>
            <div id="change-room-form">
                <label style="font-size: 13px; font-weight: 600;">Subject:</label>
                <select id="edit-sch-subject" style="width: 100%; padding: 8px; margin-bottom: 10px;"></select>
                <label style="font-size: 13px; font-weight: 600;">Teacher:</label>
                <select id="edit-sch-teacher" style="width: 100%; padding: 8px; margin-bottom: 10px;"></select>
                <label style="font-size: 13px; font-weight: 600;">Room:</label>
                <select id="room-select" style="width: 100%; padding: 8px; margin-bottom: 10px;"></select>
            </div>
            <div id="change-room-error" style="color: red; margin-top: 10px; font-size: 14px; display: none;"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button id="room-modal-cancel" style="padding: 8px 15px; margin-right: 10px; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; color: black;">Cancel</button>
                <button id="room-modal-save" style="padding: 8px 15px; background: var(--color-phys); color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Save</button>
            </div>
        </div>
    </div>

    <!-- Add query param to bust cache -->
    <script src="app.js?v=13"></script>
</body>
</html>
